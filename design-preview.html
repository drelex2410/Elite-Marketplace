<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elite Group design tokens</title>
  <link rel="stylesheet" href="public/assets/css/elite-brand.css">
  <style>
    body{margin:0;background:#f5f7f9;font:16px/1.5 Arial,sans-serif;color:#111820}.shell{max-width:1040px;margin:auto;padding:32px}.hero{display:flex;align-items:center;gap:28px;background:#101c25;color:#fff;padding:28px;border-radius:14px}.hero img{width:150px;height:150px;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:28px 0}.swatch,.panel{background:#fff;border:1px solid #d7e1e7;border-radius:8px;padding:18px}.color{height:88px;border-radius:6px;margin-bottom:12px}.actions{display:flex;gap:12px;flex-wrap:wrap}.button{display:inline-block;padding:12px 20px;border-radius:6px;background:#00d9cc;color:#101c25;font-weight:700;text-decoration:none}.button.secondary{background:#101c25;color:#fff}.field{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #d7e1e7;border-radius:6px;margin-top:8px}@media(max-width:600px){.shell{padding:18px}.hero{align-items:flex-start;flex-direction:column}.hero img{width:112px;height:112px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero"><img src="public/assets/brand/elite-group-logo.png" alt="Elite Group Cooperative Society Ltd"><div><h1>Elite Group Marketplace</h1><p>Shared brand tokens for storefront, seller, authentication, and administration.</p></div></section>
    <section class="grid">
      <div class="swatch"><div class="color" style="background:#00d9cc"></div><strong>Primary</strong><br>#00D9CC</div>
      <div class="swatch"><div class="color" style="background:#00f8f8"></div><strong>Accent</strong><br>#00F8F8</div>
      <div class="swatch"><div class="color" style="background:#101c25"></div><strong>Deep navy</strong><br>#101C25</div>
      <div class="swatch"><div class="color" style="background:#f5f7f9;border:1px solid #d7e1e7"></div><strong>Subtle surface</strong><br>#F5F7F9</div>
    </section>
    <section class="panel"><h2>Components</h2><div class="actions"><a class="button" href="#">Primary action</a><a class="button secondary" href="#">Secondary action</a></div><label for="sample">Accessible focus control</label><input class="field" id="sample" value="Elite Group"></section>
  </main>
</body>
</html>
